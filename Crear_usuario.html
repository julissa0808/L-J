<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="pagos.css">
    <script src="user.js" defer></script>
</head>
<body>
    <div class="registro">
        <h2>Crear Usuario</h2>
        <p class="subtitulo">Complete los datos para crear su cuenta</p>
        <!-- IMPORTANTE: Añadido el action apuntando al archivo PHP -->
        <form action="registro.php" method="POST">
            
            <!-- Nombre -->
            <div class="inputBox">
                <label for="nombre">Nombre <span class="requerido">*</span></label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required minlength="2" maxlength="50">
            </div>

            <!-- Apellido -->
            <div class="inputBox">
               <label for="apellido">Apellido <span class="requerido">*</span></label>
               <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required minlength="2" maxlength="50">
            </div>

            <!-- Correo -->
            <div class="inputBox">
                <label for="correo">Correo electrónico <span class="requerido">*</span></label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <!-- Teléfono -->
            <div class="inputBox">
                <label for="numero">Número de teléfono <span class="requerido">*</span></label>
                <input type="tel" id="numero" name="numero" placeholder="809 123 4567" pattern="[0-9\s\-+()]{7,}" title="Ingrese un número válido" required>
            </div>

            <!-- Contraseña -->
            <div class="inputBox">
                <label for="password">Contraseña <span class="requerido">*</span></label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
               <div class="fortaleza-contra" id="fortalezaContra"></div>
           </div>
		   
		   

            <!-- Confirmar contraseña -->
            <div class="inputBox">
               <label for="confirmar">Confirmar contraseña <span class="requerido">*</span></label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repita su contraseña" required>
                <div class="coincide" id="coincideContra"></div>
            </div>

            <!-- Sexo -->
            <div class="inputBox">
                <label for="sexo">Sexo <span class="requerido">*</span></label>
                <select name="sexo" id="sexo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="no-decir">Prefiero no decirlo</option>
                </select>
            </div>

            <!-- Edad -->
            <div class="inputBox">
                <label for="edad">Edad <span class="requerido">*</span></label>
                <select name="edad" id="edad" required>
                    <option value="">Seleccione su edad</option>
                    <option value="18">18 años</option>
                    <option value="19">19 años</option>
                    <option value="20">20 años</option>
                    <option value="21">21 años</option>
                    <option value="22">22 años</option>
                    <option value="23">23 años</option>
                    <option value="24">24 años</option>
                    <option value="25">25 años</option>
                    <option value="26">26 años</option>
                    <option value="27">27 años</option>
                    <option value="28">28 años</option>
                    <option value="29">29 años</option>
                    <option value="30">30 años</option>
                    <option value="31">31 años</option>
                    <option value="32">32 años</option>
                    <option value="33">33 años</option>
                    <option value="34">34 años</option>
                    <option value="35">35 años o más</option>
                </select>
           </div>

            <!-- Botones -->
            <div class="botones">
                <button type="submit" class="mi-boton1 principal">Crear cuenta</button>
                <a href="login.html" class="mi-boton1 secundario">Ya tengo cuenta</a>
            </div>
        </form>
    </div>
</body>
</html>
